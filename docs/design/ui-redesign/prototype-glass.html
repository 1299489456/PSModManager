<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PSModManager · 界面原型 · 玻璃拟态</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ===== 玻璃拟态 · 夜航：深墨夜景 + 克制光源；玻璃只借光不带色；唯一强调色香槟金 ===== */
:root{
  --night-deep:#060A13; --night:#0B1322; --night-steel:#16233A; --moon-steel:#33517A; --moonlight:#7C9CC4; --champagne:#E4B863; --champagne-hi:#F2D392;
  --glass:rgba(255,255,255,.075); --glass-2:rgba(255,255,255,.11); --glass-hi:rgba(255,255,255,.16);
  --edge:rgba(255,255,255,.14); --edge-hi:rgba(255,255,255,.3);
  --text:#F3F6FB; --text-2:rgba(232,238,248,.78); --text-3:rgba(205,216,236,.52);
  --ok:#6BE08F; --warn:#FFB54A; --rose:#FF7891;
  --blur:blur(40px) saturate(180%); --blur-heavy:blur(60px) saturate(180%);
  --lift:0 16px 40px rgba(3,7,18,.5),inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(2,6,16,.35);
  --lift-hi:0 24px 64px rgba(3,7,18,.62),0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(2,6,16,.35);
  --spring:cubic-bezier(.16,1,.3,1);
  --font:"Inter","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night)}
body{font:15px/1.55 var(--font);color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
code{font-family:var(--mono);font-size:.86em;color:#EAD5A6}
.ic{flex:none;display:inline-block;vertical-align:-.18em}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
::selection{background:rgba(228,184,99,.35);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:10px;border:3px solid transparent;background-clip:padding-box}

/* scene: night ink + drifting light wells (parallax follows the pointer) + film grain */
.scene{position:fixed;inset:0;min-width:1040px;overflow:clip;background:linear-gradient(165deg,var(--night-deep) 0%,var(--night) 55%,var(--night-steel) 100%)}
.wells{position:absolute;inset:-10%;pointer-events:none;transform:translate3d(var(--px,0),var(--py,0),0);transition:transform 1.2s var(--spring)}
.wells i{position:absolute;border-radius:50%;filter:blur(10px)}
.wells .w1{width:760px;height:760px;right:-4%;top:-14%;background:radial-gradient(circle,rgba(124,156,196,.26),transparent 62%);animation:drift1 38s ease-in-out infinite alternate}
.wells .w2{width:680px;height:680px;left:-8%;bottom:-18%;background:radial-gradient(circle,rgba(51,81,122,.42),transparent 62%);animation:drift2 46s ease-in-out infinite alternate}
.wells .w3{width:460px;height:460px;left:34%;top:30%;background:radial-gradient(circle,rgba(228,184,99,.09),transparent 60%);animation:drift1 52s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(-60px,40px)}}@keyframes drift2{to{transform:translate(70px,-30px)}}
.grain{position:absolute;inset:0;pointer-events:none;z-index:40;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

/* material */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--edge);box-shadow:var(--lift)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(to bottom,rgba(255,255,255,.1),transparent 42%)}

/* window chrome */
.titlebar{position:absolute;top:0;left:0;right:0;height:34px;z-index:30;display:flex;align-items:center;gap:8px;padding-left:16px;font-size:12px;color:var(--text-3);user-select:none}
.titlebar .mark{width:15px;height:15px;border-radius:5px;background:linear-gradient(140deg,#F0D08A,#C9953F)}
.demo{margin-left:auto;display:flex;align-items:center;gap:6px;padding:2px 6px 2px 10px;border-radius:999px;background:rgba(228,184,99,.1);border:1px solid rgba(228,184,99,.3);color:#EDCB85}
.demo select{border:0;background:transparent;color:inherit;font-size:12px;outline:none;cursor:pointer}.demo option{background:#16233A;color:#fff}
.wc{display:flex}.wc span{width:46px;height:34px;display:grid;place-items:center}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 16px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.08);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px rgba(3,7,18,.35),inset 0 1px 0 rgba(255,255,255,.16);transition:transform .5s var(--spring),box-shadow .5s var(--spring),background .4s var(--spring),border-color .4s var(--spring)}
.btn:hover{background:rgba(255,255,255,.14);border-color:var(--edge-hi);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.gold{background:linear-gradient(180deg,#EDC97C,#D9A84D);border-color:rgba(255,236,190,.5);color:#21180A;font-weight:600;box-shadow:0 8px 28px rgba(228,184,99,.3),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(120,80,20,.35)}
.btn.gold:hover{box-shadow:0 14px 36px rgba(228,184,99,.42),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.plain{background:transparent;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;color:var(--text-2)}
.btn.plain:hover{background:rgba(255,255,255,.07);color:var(--text)}
.btn.rose{color:var(--rose);border-color:rgba(255,120,145,.35)}
.btn.rose-fill{background:rgba(255,45,85,.7);border-color:rgba(255,140,160,.5)}
.btn.sm{height:30px;padding:0 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.4;pointer-events:none}
.btn:focus-visible,.row:focus-visible,.dock button:focus-visible{outline:2px solid var(--champagne);outline-offset:2px}
.link{background:none;border:0;padding:0;color:#EDCB85;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.link:hover{color:#fff}

/* switch */
.gs{position:relative;display:inline-block;width:46px;height:28px;flex:none;cursor:pointer}
.gs input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.gs span{position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 3px rgba(0,0,0,.35);transition:background .5s var(--spring),box-shadow .5s var(--spring),border-color .5s var(--spring)}
.gs span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:linear-gradient(180deg,#fff,#E6EBF3);box-shadow:0 3px 8px rgba(3,7,18,.5);transition:transform .55s var(--spring),width .25s var(--spring)}
.gs input:active+span::after{width:24px}
.gs input:checked+span{background:linear-gradient(180deg,rgba(237,201,124,.95),rgba(215,166,75,.95));border-color:rgba(255,236,190,.55);box-shadow:0 0 18px rgba(228,184,99,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.gs input:checked+span::after{transform:translateX(18px)}
.gs input:checked:active+span::after{transform:translateX(14px)}
.gs input:focus-visible+span{outline:2px solid var(--champagne);outline-offset:2px}
.gs input:disabled+span{opacity:.4}

/* ===== dynamic island ===== */
.island-wrap{position:absolute;top:42px;left:50%;transform:translateX(-50%);z-index:25}
.island{position:relative;height:46px;width:320px;border-radius:24px;overflow:hidden;background:rgba(10,16,30,.55);-webkit-backdrop-filter:var(--blur-heavy);backdrop-filter:var(--blur-heavy);border:1px solid var(--edge);box-shadow:var(--lift-hi);transition:width .6s var(--spring),height .6s var(--spring),border-radius .6s var(--spring),box-shadow .6s var(--spring),border-color .6s var(--spring)}
.island::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(to bottom,rgba(255,255,255,.1),transparent 50%)}
.island[data-mode=dirty]{border-color:rgba(228,184,99,.45);box-shadow:var(--lift-hi),0 0 0 1px rgba(228,184,99,.18),0 0 36px rgba(228,184,99,.18)}
.island[data-mode=expanded]{border-radius:30px}
.island[data-mode=running]{border-color:rgba(107,224,143,.35)}
.island-inner{position:absolute;left:0;top:0;width:max-content;animation:isl .45s var(--spring)}
@keyframes isl{from{opacity:0;filter:blur(6px);transform:scale(.97)}}
.isl-row{display:flex;align-items:center;gap:12px;height:44px;padding:0 8px 0 16px;font-size:14px;white-space:nowrap}
.isl-row.click{cursor:pointer}
.isl-row .sep{width:1px;height:18px;background:var(--edge)}
.isl-row .muted{color:var(--text-3)}
.isl-row .hl{color:var(--champagne);font-weight:600}
.isl-row .end{display:flex;gap:6px;margin-left:6px}
.isl-ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--text-3)}
.dot.ok{background:#34C759;box-shadow:0 0 10px rgba(52,199,89,.8)}.dot.warn{background:#FF9500;box-shadow:0 0 10px rgba(255,149,0,.8)}
.dot.gold{background:var(--champagne);box-shadow:0 0 0 0 rgba(228,184,99,.6);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 7px rgba(228,184,99,0)}}
.dot.run{background:#34C759;animation:breathe-g 2s ease-in-out infinite}
@keyframes breathe-g{0%{box-shadow:0 0 0 0 rgba(52,199,89,.6)}70%{box-shadow:0 0 0 8px rgba(52,199,89,0)}}
.ring{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:3}.ring .bg{stroke:rgba(255,255,255,.14)}.ring .fg{stroke:var(--champagne);stroke-linecap:round;transition:stroke-dashoffset .2s}
.isl-panel{width:560px;padding:4px 18px 18px}
.isl-panel h4{margin:14px 0 8px;font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:.06em}
.isl-game{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.isl-game .grow{flex:1;min-width:0}.isl-game b{display:block}.isl-game code{display:block;color:var(--text-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;background:linear-gradient(140deg,rgba(124,156,196,.6),rgba(51,81,122,.75));box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.checks{display:flex;flex-direction:column;gap:2px}
.checks div{display:flex;align-items:center;gap:10px;padding:8px 4px;font-size:14px}
.checks small{margin-left:auto;color:var(--text-3);font-size:12.5px}
.checks .ok{color:var(--ok)}.checks .warn{color:var(--warn)}
.isl-acts{display:flex;gap:8px;margin-top:12px;align-items:center}
.isl-acts .grow{flex:1}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#C9953F,#F2D392);box-shadow:0 0 12px rgba(228,184,99,.6);transition:width .15s}

/* ===== dock ===== */
.dock{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:25;display:flex;align-items:flex-end;gap:6px;padding:8px 10px;border-radius:30px}
.dock .item{position:relative;width:62px;height:58px;border:0;background:transparent;border-radius:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-2);font-size:11.5px;transform-origin:50% 100%;transition:transform .35s var(--spring),color .3s,background .3s}
.dock .item:hover{color:#fff;background:rgba(255,255,255,.06)}
.dock .item.on{color:#fff}
.dock .item.on::after{content:"";position:absolute;bottom:-3px;width:5px;height:5px;border-radius:50%;background:var(--champagne);box-shadow:0 0 10px var(--champagne)}
.dock .item:disabled{opacity:.3;pointer-events:none}
.dock .item .bdg{position:absolute;top:4px;right:10px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#FF2D55;color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 10px rgba(255,45,85,.6)}
.dock .item .bdg.gold{background:var(--champagne);color:#21180A;box-shadow:0 0 10px rgba(228,184,99,.6)}
.dock .div{width:1px;height:40px;background:var(--edge);margin:0 6px 9px}
.orb{position:relative;width:64px;height:64px;margin:-14px 2px 0;border-radius:50%;border:1px solid rgba(255,236,190,.55);background:radial-gradient(circle at 35% 28%,#FFF1CC 0%,#EDC97C 32%,#C9953F 100%);color:#21180A;cursor:pointer;display:grid;place-items:center;box-shadow:0 10px 30px rgba(228,184,99,.38),inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 6px rgba(120,80,20,.4);transition:transform .5s var(--spring),box-shadow .5s var(--spring)}
.orb:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 18px 44px rgba(228,184,99,.5),inset 0 2px 0 rgba(255,255,255,.65)}
.orb:active{transform:scale(.96)}
.orb:disabled{filter:grayscale(.7) brightness(.6);pointer-events:none}
.orb .lbl{position:absolute;bottom:-19px;font-size:11.5px;color:var(--text-2);white-space:nowrap}
.orb.running{background:radial-gradient(circle at 35% 28%,#D9FBE4,#6BE08F 40%,#1F8F4A);border-color:rgba(190,255,210,.5);box-shadow:0 10px 30px rgba(52,199,89,.35),inset 0 2px 0 rgba(255,255,255,.5)}
.orb.running::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(107,224,143,.9));-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%);animation:spin 2.4s linear infinite}

/* ===== stage & page transitions ===== */
.stage{position:absolute;inset:0;padding:108px 40px 112px;transition:filter .5s var(--spring),transform .5s var(--spring)}
.scene.depth .stage,.scene.dragging .stage{filter:blur(8px) brightness(.7);transform:scale(.985)}
.page{height:100%;display:flex;flex-direction:column;max-width:1320px;margin:0 auto;animation:enter .7s var(--spring)}
.page.leave{animation:leave .26s ease forwards}
@keyframes enter{from{opacity:0;filter:blur(14px);transform:scale(1.02)}}
@keyframes leave{to{opacity:0;filter:blur(10px);transform:scale(.985)}}

.hero{display:flex;align-items:flex-end;gap:20px;margin-bottom:18px}
.eyebrow{font-size:12.5px;color:var(--text-3);letter-spacing:.08em;margin-bottom:2px}
.hero h1{margin:0;font-weight:300;font-size:30px;letter-spacing:.01em;display:flex;align-items:baseline;gap:10px}
.hero h1 .num{font-size:46px;font-weight:300;color:var(--champagne);font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(228,184,99,.35)}
.hero h1 .den{color:var(--text-3);font-size:24px}
.hero .acts{margin-left:auto;display:flex;gap:10px;align-items:center}
.capsule{display:flex;align-items:center;gap:8px;height:40px;width:230px;padding:0 14px;border-radius:999px;color:var(--text-3);transition:width .6s var(--spring),border-color .4s}
.capsule:focus-within{width:340px;border-color:rgba(228,184,99,.45)}
.capsule input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px;color:var(--text)}
.capsule input::placeholder{color:var(--text-3)}
.notice{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:20px;margin-bottom:16px;font-size:14px;border-color:rgba(255,149,0,.35)}
.notice .ic{color:var(--warn)}.notice .grow{flex:1}

/* segmented with sliding thumb */
.seg{position:relative;display:inline-flex;padding:4px;border-radius:999px;margin-bottom:14px;align-self:flex-start}
.seg button{position:relative;z-index:1;height:32px;padding:0 16px;border:0;background:transparent;border-radius:999px;color:var(--text-2);font-size:13.5px;cursor:pointer;transition:color .4s}
.seg button.on{color:#fff}
.seg button .n{margin-left:6px;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.seg button.on .n{color:var(--champagne)}
.seg .thumb{position:absolute;top:4px;bottom:4px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 14px rgba(3,7,18,.4);transition:left .55s var(--spring),width .55s var(--spring)}

/* list + detail sheets */
.split{flex:1;min-height:0;display:flex;gap:18px}
.sheet{border-radius:28px;overflow:hidden;display:flex;flex-direction:column}
.list{flex:1;min-width:0}
.scroller{position:relative;flex:1;overflow:auto;padding:8px}
.glide{position:absolute;left:8px;right:8px;top:0;height:0;border-radius:18px;pointer-events:none;opacity:0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 24px rgba(3,7,18,.35);transition:top .55s var(--spring),height .55s var(--spring),opacity .3s}
.glide::after{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--champagne);box-shadow:0 0 12px var(--champagne)}
.group{padding:14px 14px 6px;font-size:12px;color:var(--text-3);letter-spacing:.08em}
.row{position:relative;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;cursor:pointer;outline:none;transition:opacity .4s}
.row::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.09),transparent 60%);transition:opacity .4s}
.row:hover::after{opacity:1}
.row.off{opacity:.62}
.row.arrive{animation:arrive 1.6s var(--spring)}
@keyframes arrive{0%{opacity:0;transform:translateY(16px);filter:blur(6px)}30%{opacity:1;transform:none;filter:none;background:rgba(228,184,99,.18)}100%{background:transparent}}
.glyph{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.14);color:#BFD1EA}
.glyph.plugin{color:#C9BDFF}.glyph.lib{color:#93DDD6}
.glyph.lg{width:56px;height:56px;border-radius:18px}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt small{display:block;font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{display:flex;gap:10px;align-items:center;font-size:12.5px;white-space:nowrap}
.state .pend{color:var(--champagne)}.state .bad{color:var(--rose);display:flex;align-items:center;gap:4px}.state .new{color:#BFD1EA}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;color:var(--text-3);padding:40px}
.empty b{color:var(--text);font-size:17px;font-weight:500}

.detail{width:380px;flex:none;transition:opacity .4s,transform .6s var(--spring),width .6s var(--spring),margin .6s var(--spring)}
.detail.closed{opacity:0;transform:translateX(30px);pointer-events:none;width:0;margin-left:-18px;border-width:0}
.detail>.d-scroll,.detail>.d-foot{min-width:380px}
.d-scroll{flex:1;overflow:auto;padding:24px}
.d-swap{animation:swap .5s var(--spring)}
@keyframes swap{from{opacity:0;filter:blur(8px);transform:translateY(6px)}}
.d-head{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.d-head h2{margin:0;font-size:21px;font-weight:500;line-height:1.25}
.d-head p{margin:3px 0 0;color:var(--text-3);font-size:13px}
.d-close{position:absolute;right:14px;top:14px;z-index:2}
.d-toggle{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);margin-bottom:14px}
.d-toggle .grow{flex:1}.d-toggle b{display:block;font-weight:500}.d-toggle small{display:block;color:var(--text-3);font-size:12.5px}.d-toggle small.p{color:var(--champagne)}
.issue{padding:14px 16px;border-radius:20px;margin-bottom:14px;background:rgba(255,45,85,.1);border:1px solid rgba(255,120,145,.28);font-size:13.5px;color:#FFD0D8;box-shadow:0 0 30px rgba(255,45,85,.08)}
.issue b{display:flex;align-items:center;gap:6px;color:#fff;font-weight:500;margin-bottom:2px}.issue .ic{color:var(--rose)}
.issue .acts{display:flex;gap:16px;margin-top:8px}
.facts{display:grid;grid-template-columns:56px 1fr;gap:9px 12px;margin:4px 0 18px;font-size:13.5px}
.facts dt{color:var(--text-3)}.facts dd{margin:0;word-break:break-all}
.sec{font-size:12px;color:var(--text-3);letter-spacing:.08em;margin:18px 0 8px;display:flex}
.sec span{margin-left:auto}
.tree{border-radius:18px;background:rgba(3,7,18,.25);border:1px solid rgba(255,255,255,.06);padding:8px 0;font-size:13px}
.tree div{display:flex;align-items:center;gap:8px;padding:4px 14px;color:var(--text-2);white-space:nowrap}
.tree .sz{margin-left:auto;color:var(--text-3);font-size:12px}
.cfg{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09)}
.cfg .grow{flex:1}.cfg small{display:block;color:var(--text-3);font-size:12px}
.d-foot{display:flex;align-items:center;gap:10px;padding:14px 22px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:var(--text-3)}
.d-foot span{flex:1}

/* logs */
.logs{flex:1;min-height:0;display:flex;gap:18px}
.logsheet{flex:1.3;min-width:0}
.aisheet{flex:1;min-width:380px;-webkit-backdrop-filter:var(--blur-heavy);backdrop-filter:var(--blur-heavy)}
.l-tools{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.l-tools .capsule{width:auto;flex:1;height:36px}.l-tools .capsule:focus-within{width:auto}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2);cursor:pointer;white-space:nowrap}
.chk input{accent-color:var(--champagne)}
.finding{display:flex;align-items:center;gap:10px;margin:12px 16px 0;padding:10px 14px;border-radius:16px;background:rgba(255,45,85,.09);border:1px solid rgba(255,120,145,.25);font-size:13px;color:#FFD0D8}
.finding .ic{color:var(--rose)}.finding .grow{flex:1}
.lines{flex:1;overflow:auto;padding:10px 0;font:13px/1.85 var(--mono)}
.ln{position:relative;display:flex;padding-right:16px}
.ln:hover{background:rgba(255,255,255,.035)}
.ln i{font-style:normal;width:52px;flex:none;text-align:right;padding-right:16px;color:rgba(200,212,232,.3);user-select:none}
.ln span{flex:1;white-space:pre-wrap;word-break:break-all;color:rgba(226,233,246,.86)}
.ln.e span{color:#FF9FB1}.ln.e{background:linear-gradient(90deg,rgba(255,45,85,.12),transparent 70%)}
.ln.w span{color:#FFC876}
.ln mark{background:rgba(228,184,99,.4);color:#fff;border-radius:3px}
.ln.spot{animation:spot 2s var(--spring)}
@keyframes spot{0%{background:linear-gradient(90deg,transparent,rgba(228,184,99,.0))}20%{background:rgba(228,184,99,.28);box-shadow:inset 3px 0 0 var(--champagne)}100%{}}
.ln .ask{position:absolute;right:12px;top:2px;opacity:0;height:24px;padding:0 10px;border-radius:999px;border:1px solid rgba(228,184,99,.4);background:rgba(10,16,30,.7);color:#EDCB85;font:12px var(--font);cursor:pointer;transition:opacity .3s}
.ln:hover .ask{opacity:1}
.l-foot{padding:10px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:var(--text-3)}
.ai-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.ai-head b{font-weight:500}.ai-head .model{font-size:12px;color:var(--text-3);padding:2px 10px;border-radius:999px;border:1px solid var(--edge)}
.ai-head .grow{flex:1}
.ai-body{flex:1;overflow:auto;padding:20px}
.ai-empty{text-align:center;color:var(--text-3);font-size:13.5px;padding-top:18px}
.ai-empty .orbit{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;color:var(--champagne);background:radial-gradient(circle,rgba(228,184,99,.18),transparent 70%);border:1px solid rgba(228,184,99,.3);animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.ai-empty b{display:block;color:var(--text);font-size:17px;font-weight:500;margin-bottom:4px}
.starts{display:flex;flex-direction:column;gap:8px;margin-top:20px;text-align:left}
.starts button{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);cursor:pointer;color:var(--text);font-size:13.5px;text-align:left;transition:all .4s var(--spring)}
.starts button:hover{background:rgba(255,255,255,.1);transform:translateX(4px);border-color:rgba(228,184,99,.35)}
.starts .ic{color:var(--champagne)}
.m-user{display:flex;justify-content:flex-end;margin-bottom:16px;animation:swap .5s var(--spring)}
.m-user div{max-width:85%;padding:10px 15px;border-radius:20px 20px 6px 20px;background:rgba(228,184,99,.14);border:1px solid rgba(228,184,99,.3);font-size:14px}
.m-user small{display:block;color:var(--text-3);font-size:12px;margin-top:2px}
.m-ai{margin-bottom:18px;font-size:14px;color:var(--text-2);animation:swap .6s var(--spring)}
.m-ai .who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);margin-bottom:8px}
.m-ai h4{margin:0 0 6px;font-size:16px;font-weight:500;color:#fff}
.m-ai p{margin:0 0 10px}.m-ai ol{margin:0 0 12px;padding-left:20px}
.cite{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;border:1px solid rgba(228,184,99,.35);background:rgba(228,184,99,.08);color:#EDCB85;font-size:12.5px;cursor:pointer;margin-bottom:10px;transition:background .3s}
.cite:hover{background:rgba(228,184,99,.18)}
.act{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;margin-top:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09)}
.act .grow{flex:1;min-width:0}.act b{display:block;font-weight:500;color:#fff}.act small{display:block;color:var(--text-3);font-size:12.5px}
.act .done{color:var(--ok);font-size:12.5px;display:flex;gap:4px;align-items:center;white-space:nowrap}
.typing{display:flex;align-items:center;gap:10px;color:var(--text-3);font-size:13px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--champagne);animation:blink 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.2}}
.compose{padding:14px 16px;border-top:1px solid rgba(255,255,255,.07)}
.pillbox{display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 14px;border-radius:24px;background:rgba(255,255,255,.06);border:1px solid var(--edge);transition:border-color .4s}
.pillbox:focus-within{border-color:rgba(228,184,99,.45)}
.pillbox textarea{flex:1;border:0;outline:0;resize:none;background:transparent;min-height:42px;max-height:120px;font-size:14px;padding-top:9px}
.pillbox textarea::placeholder{color:var(--text-3)}
.send{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(180deg,#EDC97C,#D9A84D);color:#21180A;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(228,184,99,.35);transition:transform .4s var(--spring)}
.send:hover{transform:scale(1.07)}.send:disabled{opacity:.35;pointer-events:none}
.atts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:12px;color:var(--text-2)}
.chip button{border:0;background:transparent;color:var(--text-3);cursor:pointer;display:grid;place-items:center;padding:2px}
.chip.add{border-style:dashed;cursor:pointer;padding:0 10px}
.hint{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--text-3)}
.ai-off{text-align:center;padding:26px 20px;color:var(--text-2);font-size:13.5px}
.ai-off b{display:block;color:#fff;font-size:16px;font-weight:500;margin:10px 0 4px}
.local{margin:16px 0 0;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);font-size:13.5px;text-align:left}
.local small{display:flex;align-items:center;gap:6px;color:var(--text-3);margin-bottom:6px}

/* profiles carousel */
.cards{display:flex;gap:18px;overflow-x:auto;padding:6px 4px 20px;scroll-snap-type:x mandatory}
.pcard{scroll-snap-align:start;flex:none;width:300px;min-height:300px;border-radius:30px;padding:24px;display:flex;flex-direction:column;transition:transform .6s var(--spring),box-shadow .6s var(--spring)}
.pcard:hover{transform:translateY(-6px);box-shadow:var(--lift-hi)}
.pcard.cur{border-color:rgba(228,184,99,.5);box-shadow:var(--lift),0 0 40px rgba(228,184,99,.15)}
.pcard .big{font-size:52px;font-weight:200;color:var(--champagne);line-height:1;margin:18px 0 4px}
.pcard ul{list-style:none;margin:12px 0 18px;padding:0;color:var(--text-2);font-size:13.5px;flex:1}
.pcard li{padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard.new{border-style:dashed;align-items:center;justify-content:center;color:var(--text-3);cursor:pointer;background:rgba(255,255,255,.03);text-align:center}

/* settings: grouped list */
.groups{max-width:760px;width:100%;margin:0 auto;overflow:auto;padding-bottom:10px}
.groups h3{margin:22px 0 8px 18px;font-size:12px;color:var(--text-3);font-weight:600;letter-spacing:.08em}
.glist{border-radius:24px;overflow:hidden}
.gitem{display:flex;align-items:center;gap:14px;min-height:54px;padding:8px 18px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
.gitem:last-child{border-bottom:0}
.gitem label{width:120px;color:var(--text-2);flex:none}
.gitem .v{flex:1;min-width:0;color:var(--text-2);word-break:break-all}
.gin{flex:1;height:36px;border:0;border-radius:12px;padding:0 12px;background:rgba(3,7,18,.3);outline:none;font-size:14px;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.gin:focus{box-shadow:inset 0 1px 2px rgba(0,0,0,.3),0 0 0 2px rgba(228,184,99,.35)}

/* onboarding */
.welcome{margin:auto;width:640px;padding:44px 48px;border-radius:36px;text-align:center}
.welcome h1{margin:0 0 8px;font-size:34px;font-weight:300}
.welcome h1 em{font-style:normal;color:var(--champagne)}
.welcome p{color:var(--text-2);margin:0 0 28px}
.path{display:flex;justify-content:center;gap:0;margin:0 0 30px}
.path div{width:150px;text-align:center;font-size:13px;color:var(--text-3);position:relative}
.path div::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--edge-hi),transparent)}
.path div:first-child::before{display:none}
.path span{position:relative;z-index:1;width:30px;height:30px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid var(--edge);font-size:13px}
.path .cur span{background:var(--champagne);color:#21180A;border-color:transparent;box-shadow:0 0 20px rgba(228,184,99,.5)}
.path .cur{color:var(--text)}
.scan{height:2px;width:220px;margin:18px auto 0;border-radius:2px;background:linear-gradient(90deg,transparent,var(--champagne),transparent);background-size:200% 100%;animation:sweep 1.2s linear infinite}
@keyframes sweep{from{background-position:200% 0}to{background-position:-200% 0}}

/* bottom sheets (modals) */
.veil{position:absolute;inset:0;z-index:35;background:rgba(3,7,18,.25);animation:fade .4s ease}
@keyframes fade{from{opacity:0}}
.msheet{position:absolute;left:50%;bottom:110px;z-index:36;width:600px;max-height:calc(100% - 200px);display:flex;flex-direction:column;border-radius:32px;transform:translateX(-50%);background:rgba(18,28,48,.6);-webkit-backdrop-filter:var(--blur-heavy);backdrop-filter:var(--blur-heavy);animation:rise .65s var(--spring)}
.msheet.out{animation:sink .3s ease forwards}
@keyframes rise{from{opacity:0;transform:translate(-50%,60px) scale(.96)}}
@keyframes sink{to{opacity:0;transform:translate(-50%,40px) scale(.97)}}
.ms-head{display:flex;align-items:flex-start;gap:12px;padding:24px 26px 6px}
.ms-head h2{margin:0;font-size:20px;font-weight:500}.ms-head p{margin:4px 0 0;color:var(--text-3);font-size:13.5px}
.ms-head .btn{margin-left:auto}
.ms-body{padding:14px 26px;overflow:auto}
.ms-foot{display:flex;align-items:center;gap:10px;padding:16px 26px 22px}
.ms-foot .grow{flex:1;font-size:12.5px;color:var(--text-3);display:flex;align-items:center;gap:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 10px;border-radius:24px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);cursor:pointer;color:var(--text);transition:all .5s var(--spring)}
.tile:hover{transform:translateY(-4px);background:rgba(255,255,255,.1);border-color:rgba(228,184,99,.4);box-shadow:0 16px 40px rgba(3,7,18,.45)}
.tile .ic{color:var(--champagne)}.tile small{color:var(--text-3);font-size:12px}
.shimmer div{height:14px;border-radius:7px;margin:12px 0;background:linear-gradient(90deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,.14) 50%,rgba(255,255,255,.05) 100%);background-size:200% 100%;animation:sweep 1.4s linear infinite}
.fine{font-size:12.5px;color:var(--text-3);line-height:1.65;margin:14px 2px 0}
.fl{display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:rgba(3,7,18,.25);border:1px solid rgba(255,255,255,.07);margin-top:12px}
.fl div{display:flex;gap:12px;padding:9px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.05);animation:swap .5s var(--spring) both}
.fl div:last-child{border-bottom:0}
.fl span{flex:1}.fl em{font-style:normal;color:var(--text-3);width:120px}.fl i{font-style:normal;color:var(--text-3);width:60px;text-align:right}
.ginput{width:100%;height:46px;border:0;border-radius:16px;padding:0 16px;background:rgba(3,7,18,.3);font-size:17px;outline:none;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.ginput:focus{box-shadow:inset 0 1px 2px rgba(0,0,0,.3),0 0 0 2px rgba(228,184,99,.35)}
.inst{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);margin-bottom:8px}
.inst.cur{border-color:rgba(228,184,99,.4)}
.inst .grow{flex:1;min-width:0}.inst code{display:block;color:var(--text-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* drag lens */
.lens{position:absolute;left:50%;top:50%;z-index:45;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;display:grid;place-items:center;text-align:center;pointer-events:none;opacity:0;transform:scale(.7);transition:opacity .4s,transform .6s var(--spring);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.2),rgba(255,255,255,.05) 60%);-webkit-backdrop-filter:blur(30px) saturate(200%);backdrop-filter:blur(30px) saturate(200%);border:1px solid rgba(255,255,255,.3);box-shadow:var(--lift-hi),0 0 80px rgba(228,184,99,.2)}
.scene.dragging .lens{opacity:1;transform:scale(1)}
.lens .ic{color:var(--champagne);margin:0 auto 10px}.lens b{display:block;font-size:20px;font-weight:500}.lens small{color:var(--text-2)}
</style>
</head>

    <div class="starts"><button onclick="Core.ask('分析这次运行的日志')">${I('logs', 16)}分析这次运行的日志</button><button onclick="Core.ask('为什么 Workshop Decorations 没有加载？')">${I('package', 16)}为什么 Workshop Decorations 没有加载？</button><button onclick="Core.ask('游戏一启动就崩溃，可能是哪个 Mod？')">${I('alert', 16)}游戏一启动就崩溃，可能是哪个 Mod？</button></div></div>`;
  else body = A.msgs.map(m => m.role === 'user' ? `<div class="m-user"><div>${esc(m.text)}${m.att ? `<small>附带 ${esc(m.att)}</small>` : ''}</div></div>` : aiReplyHtml()).join('') + (A.busy ? `<div class="typing"><i></i><i></i><i></i>正在阅读 Latest.log…</div>` : '');
  el.innerHTML = `<div class="ai-head">${I('spark', 16)}<b>AI 排错</b>${A.configured ? `<span class="model">local-diagnostic-model</span>` : ''}<span class="grow"></span>${A.msgs.length ? `<button class="btn sm plain" onclick="S.ai.msgs=[];renderAi()">新对话</button>` : ''}</div>
    <div class="ai-body" id="aiBody">${body}</div>
    ${A.configured ? `<div class="compose"><div class="atts">${A.atts.map((a, i) => `<span class="chip">${I('clip', 12)}${esc(a)}<button onclick="S.ai.atts.splice(${i},1);renderAi()" aria-label="移除">${I('x', 12)}</button></span>`).join('')}<button class="chip add" onclick="if(!S.ai.atts.includes('管理器日志'))S.ai.atts.push('管理器日志');renderAi()">${I('plus', 12)}附加日志</button></div>
      <div class="pillbox"><textarea id="aiIn" placeholder="描述问题，或继续追问…" onkeydown="if(event.ctrlKey&&event.key==='Enter'){sendAi()}"></textarea><button class="send" ${A.busy ? 'disabled' : ''} onclick="sendAi()" aria-label="发送">${I('send', 16)}</button></div>
      <div class="hint"><span>${A.atts.length ? `发送：问题 + ${A.atts.join('、')}（末尾 8 KB）` : '只发送问题文本'}</span><span>Ctrl + Enter</span></div></div>` : ''}`;
  const b = $('#aiBody'); b.scrollTop = b.scrollHeight;
}
function sendAi() { const t = $('#aiIn')?.value.trim(); if (t) Core.ask(t); }

/* ---------- profiles / settings / onboarding ---------- */
function profilesHtml() {
  const onIds = S.mods.filter(m => m.saved).map(m => m.id);
  return `<section class="page"><div class="hero"><div><div class="eyebrow">可选</div><h1>方案</h1></div><div class="acts" style="color:var(--text-3);font-size:13.5px;max-width:420px;text-align:right">把一组启用选择存起来，在不同玩法之间切换。应用后同样需要保存才会写入游戏。</div></div>
    <div class="cards">${S.profiles.map(p => { const ids = p.ids || onIds, names = ids.map(i => mod(i)?.name).filter(Boolean);
      return `<div class="pcard glass ${p.cur ? 'cur' : ''}"><div style="display:flex;align-items:center;gap:8px">${I('layers', 18)}<b style="font-weight:500;font-size:17px">${esc(p.name)}</b>${p.cur ? '<span style="margin-left:auto;color:var(--champagne);font-size:12.5px">当前</span>' : ''}</div>
        <div class="big">${names.length}</div><div style="color:var(--text-3);font-size:13px">个 Mod</div><ul>${names.slice(0, 5).map(n => `<li>${esc(n)}</li>`).join('')}${names.length > 5 ? `<li>…还有 ${names.length - 5} 个</li>` : ''}</ul>
        ${p.cur ? `<button class="btn" disabled>正在使用</button>` : `<button class="btn" onclick="Core.applyProfile('${p.id}')">应用到列表</button>`}</div>`; }).join('')}
      <div class="pcard glass new" onclick="notify('已把当前选择保存为“方案 4”')">${I('plus', 28)}<div style="margin-top:8px">保存当前选择</div></div></div></section>`;
}
function settingsHtml() {
  const A = S.ai;
  return `<section class="page"><div class="groups">
    <div class="hero" style="margin:0 0 6px 18px"><div><div class="eyebrow">偏好</div><h1>设置</h1></div></div>
    <h3>AI 服务（可选）</h3><div class="glist glass">
      <div class="gitem"><label>启用 AI 排错</label><span class="v">未配置或离线时，Mod 管理照常可用</span><label class="gs" style="width:46px"><input type="checkbox" ${A.configured ? 'checked' : ''} onchange="S.ai.configured=this.checked"><span></span></label></div>
      <div class="gitem"><label>服务地址</label><input class="gin" value="${A.configured ? 'http://127.0.0.1:8000/v1' : ''}" placeholder="https://api.example.com/v1"></div>
      <div class="gitem"><label>模型</label><input class="gin" value="${A.configured ? 'local-diagnostic-model' : ''}"></div>
      <div class="gitem"><label>API 密钥</label><input class="gin" type="password" value="${A.configured ? 'sk-xxxxxxxx' : ''}" placeholder="保存在 Windows 凭据管理器"><button class="btn sm plain">清除</button></div>
      <div class="gitem"><label></label><button class="btn sm" onclick="this.nextElementSibling.style.display='inline-flex'">测试连接</button><span style="display:none;color:var(--ok);font-size:13px;align-items:center;gap:5px">${I('okc', 14)}连接成功 · 420 ms</span></div></div>
    <h3>数据位置</h3><div class="glist glass">
      <div class="gitem"><label>数据目录</label><code class="v">%LOCALAPPDATA%\\PSModManager</code><button class="btn sm plain">${I('folder', 14)}打开</button></div>
      <div class="gitem"><label>Mod 包库</label><span class="v">3 个包 · 19 MB</span><button class="btn sm plain">${I('folder', 14)}打开</button></div>
      <div class="gitem"><label>管理器日志</label><code class="v">logs\\app.log</code><button class="btn sm plain">${I('folder', 14)}打开</button></div></div>
    <h3>关于</h3><div class="glist glass"><div class="gitem"><span class="v">PSModManager v0.1.0 · Windows x64 便携版 · 基于 RimCrow（MIT）</span><button class="link">第三方声明</button></div></div>
  </div></section>`;
}
function onboardHtml() {
  return `<section class="page"><div class="welcome glass">
    <h1>欢迎，<em>夜航者</em></h1><p>先告诉我游戏装在哪里。管理器只改动 Mods、Plugins、UserLibs，不会碰存档。</p>
    <div class="path"><div class="cur"><span>1</span>选择游戏</div><div><span>2</span>确认 MelonLoader</div><div><span>3</span>启用 Mod</div></div>
    ${S.finding ? `<div style="color:var(--text-2)">正在扫描 Steam 游戏库…</div><div class="scan"></div>` : `<div style="display:flex;gap:10px;justify-content:center"><button class="btn gold" onclick="Core.findGame()">${I('search', 16)}自动查找</button><button class="btn" onclick="Core.findGame()">手动选择目录…</button></div>`}
  </div></section>`;
}

/* ---------- bottom sheets ---------- */
function openSheet(html) {
  G.sheet = true; G.expanded = false; renderIsland(); scene.classList.add('depth');
  $('#sheetHost').innerHTML = `<div class="veil" onclick="closeSheet()"></div><div class="msheet glass" role="dialog" aria-modal="true">${html}</div>`;
  setTimeout(() => ($('.msheet [autofocus]') || $('.msheet button'))?.focus(), 60);
}
function closeSheet() {
  const s = $('.msheet'); if (!s) return false;
  G.sheet = false; scene.classList.remove('depth'); s.classList.add('out'); $('.veil')?.remove();
  setTimeout(() => { if (!G.sheet) $('#sheetHost').innerHTML = ''; }, 280); return true;
}
const sheetHead = (t, p) => `<div class="ms-head"><div><h2>${t}</h2>${p ? `<p>${p}</p>` : ''}</div><button class="btn sm plain" onclick="closeSheet()" aria-label="关闭">${I('x', 16)}</button></div>`;
function openImport() {
  openSheet(`${sheetHead('导入 Mod', '保存一份副本到管理器，不会移动原文件，也不会执行任何程序。')}
    <div class="ms-body"><div class="tiles">
      <button class="tile" onclick="importAnalyze('NightVision.dll')">${I('file', 30)}<b>DLL 文件</b><small>单个 Mod 程序集</small></button>
      <button class="tile" onclick="importAnalyze('NightVision')">${I('folder', 30)}<b>文件夹</b><small>带资源的 Mod</small></button>
      <button class="tile" onclick="importAnalyze('NightVision-1.0.3.zip')">${I('zip', 30)}<b>ZIP</b><small>压缩包</small></button></div>
      <p class="fine">也可以直接把文件拖进窗口。单个文件或 ZIP 不超过 64 MiB，展开后总计不超过 256 MiB；不支持 RAR / 7z、加密、分卷或嵌套压缩包。</p></div><div class="ms-foot"></div>`);
}
function importAnalyze(file) {
  if (!$('.msheet')) openSheet('');
  $('.msheet').innerHTML = `${sheetHead('正在读取', esc(file))}<div class="ms-body shimmer"><div style="width:70%"></div><div></div><div style="width:85%"></div><div style="width:60%"></div><p class="fine">只读取文件信息，不会执行 DLL。</p></div><div class="ms-foot"></div>`;
  setTimeout(() => importPreview(file), 900);
}
function importPreview(file) {
  const base = String(file).replace(/\.(dll|zip)$/i, '').replace(/[-_ ]?\d+(\.\d+)+$/, '');
  const name = base.replace(/([a-z])([A-Z])/g, '$1 $2') || 'New Mod';
  const s = $('.msheet'); if (!s) return;
  s.innerHTML = `${sheetHead('确认导入', '检查名称和文件去向。')}
    <div class="ms-body"><input class="ginput" id="impName" value="${esc(name)}" aria-label="名称" autofocus>
      <div class="fl"><div style="animation-delay:.05s"><span>${I('file', 13)} ${esc(base)}.dll</span><em>→ Mods/</em><i>380 KB</i></div><div style="animation-delay:.12s"><span>${I('file', 13)} ${esc(base)}.cfg</span><em>→ UserData/</em><i>2 KB</i></div><div style="animation-delay:.19s"><span>${I('file', 13)} README.md</span><em>不安装</em><i>30 KB</i></div></div>
      <label class="chk" style="margin-top:14px"><input type="checkbox" id="impOn" checked>导入后启用（保存后生效）</label></div>
    <div class="ms-foot"><span class="grow">${I('shield', 13)}v1.0.3 · 不会执行 DLL 或安装脚本</span><button class="btn plain" onclick="openImport()">返回</button><button class="btn gold" onclick="Core.importMod($('#impName').value.trim()||'New Mod',$('#impOn').checked)">导入</button></div>`;
  $('#impName')?.focus();
}
function openGames() {
  openSheet(`${sheetHead('游戏安装', '管理器只改动所选安装中的 Mod 目录。')}
    <div class="ms-body"><div class="inst cur"><div class="art">${I('game', 18)}</div><div class="grow"><b>Probably Stolen · Steam</b><code>D:\\SteamLibrary\\steamapps\\common\\Probably Stolen</code></div><span style="color:var(--champagne);font-size:12.5px">使用中</span></div>
      <div class="inst"><div class="art">${I('game', 18)}</div><div class="grow"><b>Probably Stolen · 测试版</b><code>C:\\Program Files (x86)\\Steam\\steamapps\\common\\Probably Stolen Beta</code></div><button class="btn sm" onclick="closeSheet();notify('已切换到测试版安装')">使用</button></div></div>
    <div class="ms-foot"><button class="btn plain">${I('refresh', 15)}重新查找</button><span class="grow"></span><button class="btn">手动选择目录…</button></div>`);
}
function openUninstall(id) {
  const m = mod(id);
  openSheet(`${sheetHead(`卸载 ${esc(m.name)}？`)}
    <div class="ms-body" style="color:var(--text-2)">将从游戏目录删除 <b style="color:#fff">${m.files} 个文件</b> 并移出列表。${m.source === 'game' ? '<div class="issue" style="margin:14px 0 0">这个 Mod 没有保存在包库里，卸载后需要重新导入原文件。</div>' : '<p class="fine">包库中的副本会保留。只是暂时不用的话，关掉开关即可。</p>'}</div>
    <div class="ms-foot"><span class="grow"></span><button class="btn" onclick="closeSheet()" autofocus>取消</button><button class="btn rose-fill" onclick="Core.uninstall('${id}')">卸载</button></div>`);
}
function openConfig() {
  openSheet(`${sheetHead('PSWallpaper 设置', 'UserData/PSWallpaper.cfg · 只改动下面的项目，其余内容和注释保留')}
    <div class="ms-body"><div class="glist" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)">
      <div class="gitem"><label>壁纸模式</label><select class="gin"><option>随机切换</option><option>固定一张</option><option>按地图</option></select></div>
      <div class="gitem"><label>切换间隔</label><input class="gin" type="number" value="120"><span class="v" style="flex:none">秒 · 30–3600</span></div>
      <div class="gitem"><label>淡入淡出</label><span class="v"></span><label class="gs"><input type="checkbox" checked><span></span></label></div></div>
      <label class="chk" style="margin-top:14px"><input type="checkbox" checked>保存前备份原文件</label></div>
    <div class="ms-foot"><span class="grow"></span><button class="btn" onclick="closeSheet()">取消</button><button class="btn gold" onclick="closeSheet();notify('配置已保存，原文件已备份')">保存</button></div>`);
}

/* ---------- hooks ---------- */
defineUI({
  render() { $('#demoSel').innerHTML = demoOptions(); renderIsland(); renderDock(); renderPage(); },
  boot() { G.expanded = false; G.note = null; scene.classList.remove('depth'); $('#sheetHost').innerHTML = ''; this.render(); },
  onToggle(id) {
    updateRow(id); renderCounts(); renderIsland(); renderDock();
    if (S.selected === id) renderDetail(false); else if ($('#detail')) renderDetail(false);
    if (S.filter === 'on' || S.filter === 'off') setTimeout(renderRows, 420);
    if (S.page === 'logs') renderAi();
  },
  onBulk(kind, p) { if (kind === 'profile') { go('mods'); notify(`已应用“${p.name}”，检查后保存`, 'info'); } else { renderRows(); renderDetail(false); } renderIsland(); renderDock(); },
  onSave(phase, n) {
    renderIsland(); renderDock();
    if (phase === 'start' || phase === 'done' || phase === 'cancel') { $$('.row').forEach(r => updateRow(r.dataset.id)); $$('.row input,.d-toggle input').forEach(i => i.disabled = !!S.saving); renderDetail(false); }
    if (phase === 'done') notify(`已保存 · 完成 ${n} 个文件操作`);
    if (phase === 'cancel') notify('已取消，已完成的部分已恢复', 'info');
  },
  onRun(on) { renderIsland(); renderDock(); renderDetail(false); notify(on ? '已启动 Probably Stolen' : '游戏已退出', on ? 'ok' : 'info'); },
  onImported(id, on) {
    closeSheet();
    const land = () => { renderRows(); renderDetail(true); renderIsland(); renderDock(); const r = $(`.row[data-id="${id}"]`); if (r) { r.scrollIntoView({ block:'center' }); r.classList.add('arrive'); placeGlide(); } };
    if (S.page !== 'mods') { go('mods'); setTimeout(land, 300); } else land();
    notify(on ? `已导入 ${mod(id).name}，保存后启用` : `已导入 ${mod(id).name}`);
  },
  onUninstalled(m) { closeSheet(); renderRows(); renderDetail(false); renderDock(); notify(`已卸载 ${m.name}`); },
  onLoader(phase) { renderIsland(); const s = $('#noticeSlot'); if (s) s.innerHTML = noticeHtml(); if (phase === 'done') { G.expanded = false; scene.classList.remove('depth'); notify('MelonLoader 0.7.3 安装完成'); } },
  onGame(phase) { if (phase === 'finding') renderPage(); else { renderDock(); renderIsland(); go('mods'); notify('已找到 Probably Stolen（Steam）'); } },
  onAi() { renderAi(); renderDock(); },
  notify,
  escape() { if (closeSheet()) return true; if (G.expanded) { toggleIsland(); return true; } return false; },
  focusSearch() { $('#q')?.focus(); },
  onDrag(on) { scene.classList.toggle('dragging', on); },
  onDrop(name) { if (S.page !== 'mods') go('mods'); setTimeout(() => importAnalyze(name), 100); },
});
bootPrototype();
const _hp = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
if (_hp.dialog === 'import') openImport(); else if (_hp.dialog === 'preview') importPreview('NightVision-1.0.3.zip'); else if (_hp.dialog === 'env') toggleIsland(); else if (_hp.dialog === 'uninstall' && S.selected) openUninstall(S.selected);
</script>
</body>
</html>
