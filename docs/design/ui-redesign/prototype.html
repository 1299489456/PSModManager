<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PSModManager · 界面原型</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#F5F6F8; --side:#EEF0F3; --surface:#FFFFFF; --surface-2:#F8F9FB; --hover:#F2F4F7;
  --line:#E3E6EB; --line-2:#D3D8DF;
  --text:#1C2230; --text-2:#4B5465; --text-3:#7C8595;
  --accent:#2457D6; --accent-hover:#1C49B8; --accent-soft:#EBF0FD; --accent-line:#C7D5F6;
  --ok:#17803D; --ok-soft:#E6F5EC; --ok-line:#BFE3CC;
  --warn:#A75A06; --warn-soft:#FFF5E5; --warn-line:#F2D49E;
  --err:#C42F2A; --err-soft:#FDEDEC; --err-line:#F3C5C2;
  --violet:#6D4FC9; --violet-soft:#F1EDFC; --teal:#0E7C79; --teal-soft:#E5F5F4;
  --r:10px; --shadow:0 1px 2px rgba(22,32,52,.05),0 6px 20px rgba(22,32,52,.06);
  --shadow-lg:0 12px 40px rgba(22,32,52,.16),0 2px 6px rgba(22,32,52,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.5 "Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
code,.mono{font-family:"Cascadia Mono",Consolas,"Microsoft YaHei UI",monospace;font-size:.88em}
.ic{flex:none;display:inline-block;vertical-align:-0.18em}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* window chrome */
.window{position:fixed;inset:0;display:flex;flex-direction:column;min-width:1040px}
.titlebar{height:34px;flex:none;display:flex;align-items:center;gap:8px;padding-left:14px;background:#fff;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--text-2);user-select:none}
.titlebar .logo-s{width:16px;height:16px;border-radius:4px;background:var(--accent);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center}
.demo{margin-left:auto;display:flex;align-items:center;gap:6px;background:#FFF7E6;border:1px solid #F1D8A6;color:#865700;border-radius:6px;padding:1px 4px 1px 8px;font-size:12px}
.demo select{border:0;background:transparent;font-size:12px;color:inherit;cursor:pointer;outline:none}
.wc{display:flex}.wc span{width:46px;height:34px;display:grid;place-items:center;color:var(--text-3)}
.app{flex:1;display:flex;min-height:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:#fff;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:var(--hover);border-color:#C3C9D2}
.btn:focus-visible,.nav-item:focus-visible,.row:focus-visible,.game-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:rgba(22,32,52,.05);color:var(--text)}
.btn.danger{color:var(--err);border-color:var(--err-line)}
.btn.danger:hover{background:var(--err-soft)}
.btn.danger-fill{background:var(--err);border-color:var(--err);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:7px;gap:5px}
.btn.lg{height:42px;padding:0 18px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:inherit;font-weight:500;display:inline-flex;align-items:center;gap:3px}
.link:hover{text-decoration:underline}
kbd{font:11px/1 "Segoe UI",sans-serif;color:var(--text-3);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:#fff}

/* switch */
.switch{position:relative;display:inline-block;width:38px;height:22px;flex:none;cursor:pointer}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:11px;background:#C9CED6;transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(16px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.switch input:disabled+span{opacity:.45}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.pill.err{background:var(--err-soft);color:var(--err);border-color:var(--err-line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.pill.muted{background:var(--surface-2);color:var(--text-3);border-color:var(--line)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--text-3)}
.dot.ok{background:#22A355}.dot.warn{background:#E39A1C}.dot.err{background:var(--err)}.dot.run{background:#22A355;box-shadow:0 0 0 3px rgba(34,163,85,.18)}

/* sidebar */
.sidebar{width:244px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px 14px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#2D63E2,#5B8DF0);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;letter-spacing:.5px}
.brand b{display:block;font-size:15px;line-height:1.2}.brand small{color:var(--text-3);font-size:12px}
.game-card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:var(--r);background:#fff;border:1px solid var(--line);cursor:pointer;box-shadow:0 1px 2px rgba(22,32,52,.04)}
.game-card:hover{border-color:var(--line-2)}
.game-art{width:38px;height:38px;border-radius:8px;flex:none;background:linear-gradient(140deg,#FFE2B8,#FFC48A 55%,#F7A86A);display:grid;place-items:center;color:#7A3E06}
.game-card .gt{flex:1;min-width:0}.game-card b{display:block;font-size:14px}
.game-card small{display:block;color:var(--text-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-card.none .game-art{background:#E6E9EE;color:var(--text-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:12px;color:var(--text-3);padding:0 10px 4px;font-weight:500}
.nav-item{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:8px;border:0;background:transparent;color:var(--text-2);cursor:pointer;font-size:14.5px;font-weight:500;text-align:left}
.nav-item:hover{background:rgba(22,32,52,.05);color:var(--text)}
.nav-item.active{background:#fff;color:var(--accent);box-shadow:0 1px 2px rgba(22,32,52,.06)}
.nav-item:disabled{opacity:.4;cursor:not-allowed}
.nav-item .grow{flex:1}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:11.5px;font-weight:600;display:grid;place-items:center;background:rgba(22,32,52,.07);color:var(--text-3)}
.badge.warn{background:#FCE7C2;color:#8A4B00}.badge.err{background:#FBD9D7;color:var(--err)}
.side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.env-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer}
.env-row:hover{background:rgba(22,32,52,.05)}
.env-row b{display:block;font-size:13px;font-weight:600}.env-row small{display:block;font-size:12px;color:var(--text-3)}
.env-row.warn{background:var(--warn-soft);border-color:var(--warn-line)}.env-row.warn small{color:var(--warn)}
.launch-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.launch-card .btn{width:100%}
.launch-state{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2)}
.launch-state .link{margin-left:auto;font-size:12.5px}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.page{flex:1;min-height:0;display:flex;flex-direction:column;padding:22px 26px 0}
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px}
.page-head h1{margin:0;font-size:22px;font-weight:650;letter-spacing:.2px}
.page-head p{margin:2px 0 0;color:var(--text-3);font-size:13.5px}
.page-head .acts{margin-left:auto;display:flex;gap:8px}
.banner{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r);margin-bottom:14px;font-size:14px}
.banner.warn{background:var(--warn-soft);border:1px solid var(--warn-line);color:#6E3F00}
.banner.err{background:var(--err-soft);border:1px solid var(--err-line);color:#7D1E1A}
.banner.info{background:var(--accent-soft);border:1px solid var(--accent-line);color:#1C3E94}
.banner .grow{flex:1}.banner b{font-weight:600}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.seg{display:flex;background:#E9ECF0;border-radius:9px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--text-2);font-size:13.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button:hover{color:var(--text)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(22,32,52,.1)}
.seg .n{font-size:12px;color:var(--text-3);font-weight:500}
.seg button.on .n{color:var(--text-2)}
.seg .n.err{color:var(--err)}
.search{flex:1;max-width:340px;margin-left:auto;display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;background:#fff;border:1px solid var(--line-2);border-radius:8px;color:var(--text-3)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px;color:var(--text)}

/* mods */
.mods-body{flex:1;min-height:0;display:flex;gap:16px;padding-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.list-card{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.list-head{display:flex;align-items:center;gap:14px;padding:0 16px;height:38px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--text-3);font-weight:500;background:var(--surface-2)}
.list-head .c-sw{width:38px}.list-head .c-name{flex:1;padding-left:48px}.list-head .c-st{width:170px;text-align:right}
.rows{flex:1;overflow:auto}
.group-label{padding:12px 16px 6px;font-size:12px;color:var(--text-3);font-weight:600;letter-spacing:.3px}
.row{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid #EFF1F4;cursor:pointer;position:relative;outline:none}
.row:hover{background:#FAFBFC}
.row.sel{background:var(--accent-soft)}
.row.sel::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.row.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:#DCE7FD}100%{background:transparent}}
.kind{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none}
.kind.mod{background:var(--accent-soft);color:var(--accent)}
.kind.plugin{background:var(--violet-soft);color:var(--violet)}
.kind.lib{background:var(--teal-soft);color:var(--teal)}
.kind.lg{width:48px;height:48px;border-radius:12px}
.row-main{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:600;display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden}
.row-title .ver{font-size:12.5px;font-weight:500;color:var(--text-3)}
.row-sub{font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row.off .row-title{color:var(--text-2)}
.row.off .kind{filter:grayscale(.8);opacity:.7}
.row-tags{width:170px;display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;color:var(--text-3);gap:6px}
.empty b{color:var(--text);font-size:16px}
.dropzone{border:2px dashed var(--line-2);border-radius:12px;margin:18px;padding:40px 20px;background:var(--surface-2)}

.detail{width:352px;flex:none;display:flex;flex-direction:column;overflow:hidden}
.detail-scroll{flex:1;overflow:auto;padding:20px}
.d-head{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.d-head h2{margin:0;font-size:18px;font-weight:650;line-height:1.3;word-break:break-word}
.d-head p{margin:2px 0 0;font-size:13px;color:var(--text-3)}
.d-toggle{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);margin-bottom:14px}
.d-toggle .grow{flex:1}.d-toggle b{display:block;font-size:14px}.d-toggle small{display:block;font-size:12.5px;color:var(--text-3)}
.d-toggle small.pend-note{color:var(--warn)}
.callout{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);margin-bottom:14px;font-size:13.5px}
.callout.err{background:var(--err-soft);border:1px solid var(--err-line);color:#6F1C18}
.callout.err .ic{color:var(--err);margin-top:1px}
.callout b{display:block;font-size:14px;margin-bottom:2px}
.callout .acts{display:flex;gap:12px;margin-top:6px}
.facts{display:grid;grid-template-columns:64px 1fr;gap:9px 12px;margin:0 0 16px;font-size:13.5px}
.facts dt{color:var(--text-3)}.facts dd{margin:0;min-width:0;word-break:break-all}
.section-t{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text-2);margin:18px 0 8px}
.section-t .grow{flex:1}
.cfg{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r)}
.cfg .grow{flex:1;min-width:0}.cfg b{display:block;font-size:14px}.cfg small{display:block;font-size:12.5px;color:var(--text-3)}
.tree{font-size:13px;border:1px solid var(--line);border-radius:var(--r);padding:6px 0;max-height:260px;overflow:auto}
.tree div{display:flex;align-items:center;gap:7px;padding:3px 12px;color:var(--text-2);white-space:nowrap}
.tree div .sz{margin-left:auto;color:var(--text-3);font-size:12px}
.tree .ic{color:var(--text-3)}
.d-foot{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;align-items:center}
.d-foot small{color:var(--text-3);font-size:12px;flex:1}

/* pending bar */
.pending{position:absolute;left:26px;right:26px;bottom:18px;display:flex;align-items:center;gap:14px;padding:12px 14px 12px 18px;background:#fff;border:1px solid var(--warn-line);border-left:4px solid #E39A1C;border-radius:12px;box-shadow:var(--shadow-lg);animation:up .18s ease}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.pending .grow{flex:1;min-width:0}
.pending b{font-size:14.5px}
.pending .chg{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pending .chg .on{color:var(--ok);font-weight:500}.pending .chg .offc{color:var(--text-3);font-weight:500}
.pending.saving{border-left-color:var(--accent);border-color:var(--accent-line)}
.progress{height:6px;border-radius:3px;background:#E6E9EE;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .12s}
.pending .note{font-size:12.5px;color:var(--warn)}
.has-pending .mods-body{padding-bottom:96px}

/* logs */
.logs-grid{flex:1;min-height:0;display:flex;gap:16px;padding-bottom:18px}
.log-card{flex:1.25;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.ai-card{flex:1;min-width:360px;display:flex;flex-direction:column;overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-head h3{margin:0;font-size:15px;font-weight:650}
.card-head .grow{flex:1}
.src-tabs{display:flex;gap:4px}
.src-tabs button{height:30px;padding:0 10px;border-radius:7px;border:1px solid transparent;background:transparent;font-size:13px;color:var(--text-2);cursor:pointer;display:flex;align-items:center;gap:6px}
.src-tabs button:hover{background:var(--hover)}
.src-tabs button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);font-weight:500}
.log-tools{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--text-3)}
.log-tools .search{max-width:none;margin:0;height:32px}
.chk{display:flex;align-items:center;gap:6px;color:var(--text-2);cursor:pointer;white-space:nowrap}
.chk input{accent-color:var(--accent);width:15px;height:15px}
.finding{display:flex;align-items:center;gap:10px;margin:10px 14px 0;padding:9px 12px;border-radius:8px;background:var(--err-soft);border:1px solid var(--err-line);font-size:13px;color:#6F1C18}
.finding .ic{color:var(--err)}.finding .grow{flex:1}
.log-view{flex:1;overflow:auto;padding:8px 0;font-family:"Cascadia Mono",Consolas,monospace;font-size:13px;line-height:1.75;background:#FCFCFD}
.log-line{display:flex;align-items:flex-start;padding:0 14px 0 0;position:relative}
.log-line:hover{background:#F3F5F8}
.log-line .ln{width:48px;flex:none;text-align:right;padding-right:14px;color:#A7AEBA;user-select:none}
.log-line .tx{flex:1;white-space:pre-wrap;word-break:break-all;color:#2B3342}
.log-line.e{background:#FDF1F0}.log-line.e .tx{color:#B42520}.log-line.e .ln{color:#D98A86;box-shadow:inset 3px 0 0 var(--err)}
.log-line.w .tx{color:#9A5A00}
.log-line.focus{animation:flash 1.8s ease}
.log-line mark{background:#FFE58A;color:inherit;border-radius:2px}
.log-line .ask{position:absolute;right:10px;top:1px;opacity:0;font-family:"Segoe UI","Microsoft YaHei UI",sans-serif;height:24px;font-size:12px;padding:0 8px;border-radius:6px;border:1px solid var(--accent-line);background:#fff;color:var(--accent);cursor:pointer;display:flex;align-items:center;gap:4px}
.log-line:hover .ask{opacity:1}
.log-foot{padding:8px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text-3);display:flex;align-items:center;gap:10px}
.log-foot .grow{flex:1}

.ai-body{flex:1;overflow:auto;padding:18px}
.ai-empty{text-align:center;padding:28px 10px 10px;color:var(--text-3);font-size:13.5px}
.ai-empty .spark{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 12px}
.ai-empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.prompts{display:flex;flex-direction:column;gap:8px;margin-top:18px;text-align:left}
.prompts button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-size:13.5px;color:var(--text);text-align:left}
.prompts button:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.prompts .ic{color:var(--accent)}
.msg{margin-bottom:16px}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:var(--accent-soft);border:1px solid var(--accent-line);padding:9px 13px;border-radius:12px 12px 4px 12px;max-width:85%;font-size:14px}
.msg.user .att{display:block;font-size:12px;color:var(--text-3);margin-top:3px}
.msg.ai{font-size:14px;color:var(--text);animation:up .2s ease}
.msg.ai .who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);margin-bottom:6px}
.msg.ai h4{margin:0 0 6px;font-size:15px}
.msg.ai p{margin:0 0 8px}
.msg.ai ol{margin:0 0 10px;padding-left:20px}.msg.ai li{margin-bottom:3px}
.cite{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface-2);font-size:12.5px;color:var(--text-2);cursor:pointer;margin:0 0 10px}
.cite:hover{border-color:var(--accent-line);color:var(--accent)}
.typing{display:flex;align-items:center;gap:8px;color:var(--text-3);font-size:13px}
.typing i{width:6px;height:6px;border-radius:50%;background:#AAB2BF;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.act-card{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:#fff}
.act-card .grow{flex:1;min-width:0}.act-card b{display:block;font-size:14px}.act-card small{display:block;font-size:12.5px;color:var(--text-3)}
.act-card .done{font-size:12.5px;color:var(--ok);display:flex;align-items:center;gap:4px;white-space:nowrap}
.composer{border-top:1px solid var(--line);padding:12px 14px}
.atts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 6px 0 9px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;color:var(--text-2)}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--text-3);display:grid;place-items:center;padding:2px;border-radius:50%}
.chip button:hover{background:rgba(0,0,0,.06)}
.chip.add{border-style:dashed;cursor:pointer;padding:0 9px}
.chip.add:hover{border-color:var(--accent-line);color:var(--accent)}
.input-box{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line-2);border-radius:10px;padding:8px 8px 8px 12px;background:#fff}
.input-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input-box textarea{flex:1;border:0;outline:0;resize:none;min-height:44px;max-height:120px;font-size:14px;background:transparent}
.composer .hint{display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-top:6px}
.ai-off{margin:10px 0;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);text-align:center;font-size:13.5px;color:var(--text-2)}
.ai-off b{display:block;font-size:15px;color:var(--text);margin-bottom:4px}
.local-res{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;font-size:13.5px}
.local-res .t{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);margin-bottom:6px}

/* profiles & settings */
.stack{display:flex;flex-direction:column;gap:12px;max-width:820px;overflow:auto;padding-bottom:24px}
.prof{display:flex;align-items:center;gap:14px;padding:16px 18px}
.prof .grow{flex:1;min-width:0}.prof b{font-size:15px;display:flex;align-items:center;gap:8px}
.prof small{display:block;color:var(--text-3);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof .kind{background:#F1F2F5;color:var(--text-2)}
.prof.cur{border-color:var(--accent-line)}
.prof.cur .kind{background:var(--accent-soft);color:var(--accent)}
.set{padding:18px 20px}
.set h3{margin:0 0 4px;font-size:16px}
.set > p{margin:0 0 14px;color:var(--text-3);font-size:13.5px}
.field{display:grid;grid-template-columns:140px 1fr;align-items:center;gap:10px 16px;margin-bottom:12px;font-size:14px}
.field label{color:var(--text-2)}
.inp{height:36px;border:1px solid var(--line-2);border-radius:8px;padding:0 11px;background:#fff;font-size:14px;width:100%;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select.inp{cursor:pointer}
.inline{display:flex;gap:8px;align-items:center}
.kv{display:grid;grid-template-columns:140px 1fr auto;gap:10px 16px;align-items:center;font-size:14px}
.kv dt{color:var(--text-2)}.kv dd{margin:0;min-width:0;word-break:break-all}
.ok-text{color:var(--ok);font-size:13px;display:inline-flex;align-items:center;gap:5px}

/* onboarding */
.onboard{flex:1;display:grid;place-items:center;padding:30px;overflow:auto}
.ob-card{width:620px;padding:34px 36px}
.ob-card h1{margin:0 0 6px;font-size:24px}
.ob-card > p{margin:0 0 24px;color:var(--text-2)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.steps li{display:flex;gap:16px;padding:14px;border-radius:12px}
.steps li.cur{background:var(--accent-soft)}
.steps .num{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:14px;background:#E8EBEF;color:var(--text-3)}
.steps li.cur .num{background:var(--accent);color:#fff}
.steps li.done .num{background:var(--ok);color:#fff}
.steps b{display:block;font-size:15.5px;margin-top:3px}
.steps small{display:block;color:var(--text-2);font-size:13.5px;margin-top:2px}
.steps li:not(.cur) small{color:var(--text-3)}
.steps .acts{display:flex;gap:8px;margin-top:12px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(30,38,54,.28);display:grid;place-items:center;z-index:50;animation:fade .12s ease}
@keyframes fade{from{opacity:0}}
.modal{width:560px;max-width:calc(100vw - 40px);max-height:calc(100vh - 60px);display:flex;flex-direction:column;background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);animation:pop .16s ease}
.modal.wide{width:720px}.modal.narrow{width:440px}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.m-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 0}
.m-head h2{margin:0;font-size:18px;font-weight:650}
.m-head p{margin:3px 0 0;color:var(--text-3);font-size:13.5px}
.m-head .x{margin-left:auto;margin-top:-4px;margin-right:-6px}
.m-body{padding:18px 22px;overflow:auto}
.m-foot{display:flex;align-items:center;gap:8px;padding:14px 22px;border-top:1px solid var(--line)}
.m-foot .grow{flex:1;font-size:12.5px;color:var(--text-3);display:flex;align-items:center;gap:5px}
.drop{border:2px dashed var(--line-2);border-radius:12px;padding:34px 20px;text-align:center;background:var(--surface-2);transition:all .12s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .big{width:52px;height:52px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 12px;color:var(--accent)}
.drop b{display:block;font-size:16px}
.drop .or{color:var(--text-3);font-size:13px;margin:10px 0}
.drop .acts{display:flex;gap:8px;justify-content:center}
.fine{font-size:12.5px;color:var(--text-3);margin:12px 2px 0;line-height:1.6}
.ftable{width:100%;border-collapse:collapse;font-size:13px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ftable th{background:var(--surface-2);text-align:left;font-weight:500;color:var(--text-3);padding:7px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.ftable td{padding:7px 12px;border-bottom:1px solid #F0F2F5}
.ftable tr:last-child td{border-bottom:0}
.ftable td.r{text-align:right;color:var(--text-3)}
.summary{display:flex;gap:10px;margin:14px 0}
.summary div{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:12.5px;color:var(--text-3)}
.summary b{display:block;font-size:15px;color:var(--text)}
.checks{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px}
.checks li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:0}
.checks .grow{flex:1}.checks b{display:block;font-size:14px}.checks small{display:block;color:var(--text-3);font-size:12.5px}
.checks .ic.ok{color:var(--ok)}.checks .ic.warn{color:#D88A0F}
.inst{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.inst.cur{border-color:var(--accent-line);background:var(--accent-soft)}
.inst .grow{flex:1;min-width:0}.inst b{display:block;font-size:14px}
.inst code{display:block;color:var(--text-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-t{font-size:12.5px;color:var(--text-3);font-weight:600;margin:14px 0 8px}

/* toasts & drag overlay */
.toasts{position:fixed;right:22px;top:50px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{display:flex;align-items:center;gap:10px;min-width:280px;max-width:420px;padding:11px 14px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);font-size:14px;animation:slide .2s ease}
.toast .ic.ok{color:var(--ok)}.toast .ic.info{color:var(--accent)}
.toast .link{margin-left:auto;font-size:13px}
@keyframes slide{from{transform:translateX(16px);opacity:0}}
.drag-cover{position:fixed;inset:34px 0 0 0;z-index:60;background:rgba(235,240,253,.92);border:3px dashed var(--accent);border-radius:14px;margin:10px;display:none;place-items:center;text-align:center;color:var(--accent)}
.drag-cover.on{display:grid}
.drag-cover b{display:block;font-size:20px;margin-top:10px}
.drag-cover small{color:var(--text-2);font-size:14px}

  else render();

function rowKey(e, id) {
  const rows = [...document.querySelectorAll('.row')], i = rows.findIndex(r => r.id === 'row-' + id);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = rows[i + (e.key === 'ArrowDown' ? 1 : -1)]; if (n) { n.focus(); select(n.id.slice(4)); } }
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setOn(id, !mod(id).on); setTimeout(() => $('#row-' + id)?.focus()); }
}
function undoAll() { S.mods.forEach(m => m.on = m.saved); S.history = []; render(); toast('已撤销全部更改', 'info'); }
let saveTimer;
function save(thenLaunch) {
  if (!dirty() || S.running || S.saving) return;
  S.saving = { done:0, total:changes().reduce((n, m) => n + Math.max(1, Math.min(m.files, 4)), 0) + 1 };
  render();
  saveTimer = setInterval(() => {
    S.saving.done++; renderPending();
    if (S.saving.done >= S.saving.total) {
      clearInterval(saveTimer); const n = S.saving.total; S.saving = null;
      S.mods.forEach(m => m.saved = m.on); S.history = [];
      render(); toast(`已保存 · 完成 ${n} 个文件操作`, 'ok');
      if (thenLaunch) launch();
    }
  }, 160);
}
function cancelSave() { clearInterval(saveTimer); S.saving = null; render(); toast('已取消，已完成的部分已恢复原状', 'info'); }
function launch() {
  if (dirty()) { if (S.page !== 'mods') go('mods'); save(true); return; }
  S.running = true; render(); toast('已启动 Probably Stolen', 'ok');
}
function stopGame() { S.running = false; render(); toast('游戏已退出', 'info'); }
function refreshMods() { toast('已重新读取游戏目录，没有发现变化', 'info'); }

function toast(text, kind = 'ok', linkText, fn) {
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `${I(kind === 'ok' ? 'okc' : 'info', 18, kind)}<span>${esc(text)}</span>`;
  if (linkText) { const b = document.createElement('button'); b.className = 'link'; b.textContent = linkText; b.onclick = () => { fn(); el.remove(); }; el.appendChild(b); }
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 3600);
}

/* ---------- render root ---------- */
function render() {
  renderSidebar();
  if (!S.gameSet && S.page !== 'settings') S.page = 'onboard';
  ({ mods:renderMods, logs:renderLogs, profiles:renderProfiles, settings:renderSettings, onboard:renderOnboard })[S.page]();
}
function setDemo(d) { closeModal(); reset(d); $('#demoSel').value = d; render(); }

/* keyboard */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal').innerHTML) { closeModal(); return; }
  if (!e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (k === 's') { e.preventDefault(); save(); }
  if (k === 'f' && S.page === 'mods') { e.preventDefault(); $('#q')?.focus(); }
  if (k === 'z' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && S.history.length) {
    e.preventDefault(); const h = S.history.pop(); mod(h.id).on = h.prev; render();
  }
});
/* window-level drag & drop import */
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); if (!S.gameSet) return; dragDepth++; $('#dragCover').classList.add('on'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#dragCover').classList.remove('on'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; $('#dragCover').classList.remove('on');
  if (!S.gameSet) return;
  const f = e.dataTransfer.files[0]; if (f) importPreview(f.name, /\.zip$/i.test(f.name) ? 'zip' : 'dll');
});

/* boot: #demo=dirty&page=logs&dialog=import&ask=1 lets you open a given state directly */
(function boot() {
  const p = new URLSearchParams(location.hash.slice(1));
  const d = p.get('demo') || 'normal'; reset(d); $('#demoSel').value = d;
  if (p.get('select')) S.selected = p.get('select');
  if (p.get('page')) S.page = p.get('page');
  render();
  if (p.get('ask')) { S.ai.msgs.push({ role:'user', text:'分析这次运行的日志', att:'Latest.log' }, { role:'ai' }); renderAi(); }
  const dlg = p.get('dialog');
  if (dlg === 'import') openImport(); else if (dlg === 'preview') importPreview('NightVision-1.0.3.zip', 'zip');
  else if (dlg === 'loader') openLoader(); else if (dlg === 'game') openGame(); else if (dlg === 'config') openConfig(); else if (dlg === 'uninstall') openUninstall(S.selected);
})();
</script>
